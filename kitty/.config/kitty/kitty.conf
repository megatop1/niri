# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window appearance
background_opacity 0.88
hide_window_decorations yes
window_padding_width 10
remember_window_size yes
initial_window_width 1200
initial_window_height 750

# Behavior
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0
scrollback_lines 10000
confirm_os_window_close 0

# Rosé Pine Moon
foreground            #e0def4
background            #232136
selection_foreground  #e0def4
selection_background  #44415a
cursor                #e0def4
cursor_text_color     #232136

# Normal colors
color0  #393552
color1  #eb6f92
color2  #3e8fb0
color3  #f6c177
color4  #3e8fb0
color5  #c4a7e7
color6  #9ccfd8
color7  #e0def4

# Bright colors
color8  #6e6a86
color9  #eb6f92
color10 #3e8fb0
color11 #f6c177
color12 #3e8fb0
color13 #c4a7e7
color14 #9ccfd8
color15 #e0def4
